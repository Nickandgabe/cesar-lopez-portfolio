# Keep the *.run.app preview out of search engines; the custom domain is indexable.
map $host $robots_tag {
    ~\.run\.app$  "noindex, nofollow";
    default       "";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml;

    add_header X-Robots-Tag $robots_tag always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|mp4|webm)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $robots_tag always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
