# Production nginx: new site (site-v2) at the root + legacy pages from CesarPortfolioWeb.
# Password rules are carried over unchanged from CesarPortfolioWeb/nginx.conf.

# Keep *.run.app URLs (revision tags, previews) out of search engines; the custom domain is indexable.
map $host $robots_tag {
    ~\.run\.app$  "noindex, nofollow";
    default       "";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml font/woff2;

    add_header X-Robots-Tag $robots_tag always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Legacy protected pages (unchanged) ----
    location = /resume/Cesar-Lopez-Resume.pdf {
        auth_basic "Resume Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header Content-Disposition "attachment; filename=Cesar-Lopez-Resume.pdf";
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri =404;
    }

    location /resume/ {
        auth_basic "Resume Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri $uri/ =404;
    }

    location ^~ /work/toyota-auto-show/media/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri =404;
    }

    location /work/toyota-auto-show/ {
        auth_basic "Case Study Access";
        auth_basic_user_file /etc/nginx/.htpasswd-toyota;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri $uri/ =404;
    }

    location = /images/pdf/At&t.pdf {
        auth_basic "Case Study Access";
        auth_basic_user_file /etc/nginx/.htpasswd-toyota;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri =404;
    }

    # ---- New site ----
    # Hashed build assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf|mp4|webm)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $robots_tag always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
