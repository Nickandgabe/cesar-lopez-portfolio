server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml font/woff2;

    location ~* \.(?:jpg|jpeg|png|gif|webp|ico|svg|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /resume/ {
        auth_basic "Resume Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header Content-Disposition "attachment; filename=Cesar-Lopez-Resume.pdf";
        try_files $uri =404;
    }

    location ^~ /work/toyota-auto-show/media/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location /work/toyota-auto-show/ {
        auth_basic "Case Study Access";
        auth_basic_user_file /etc/nginx/.htpasswd-toyota;
        try_files $uri $uri/ =404;
    }

    location = /images/pdf/At&t.pdf {
        auth_basic "Case Study Access";
        auth_basic_user_file /etc/nginx/.htpasswd-toyota;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
