server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml font/woff2;

    location ~* \.(?:jpg|jpeg|png|gif|webp|ico|svg|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        auth_basic "Demo Access";
        auth_basic_user_file /etc/nginx/.htpasswd-toyota;
        try_files $uri /index.html;
    }
}
